<style>
/* ============================================================
   Drift GP - interface
   ============================================================ */
:root{
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --bg:#0e1116; --panel:#181c24; --panel2:#1f242e;
  --line:#2b313c; --txt:#eef1f5; --dim:#98a2b3;
  --acc:#ffd166; --acc2:#e5453a; --ok:#4ade80;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none !important}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* ---------------- HUD ---------------- */
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(10px + var(--sat)) calc(12px + var(--sar)) 0 calc(12px + var(--sal))}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hud-left{display:flex;gap:8px;align-items:center;pointer-events:auto}
.icon-btn{width:38px;height:38px;border-radius:12px;background:rgba(16,19,25,.62);
  border:1px solid rgba(255,255,255,.10);font-weight:900;font-size:13px;letter-spacing:1px;backdrop-filter:blur(6px)}
.chip{background:rgba(16,19,25,.62);border:1px solid rgba(255,255,255,.10);border-radius:12px;
  padding:5px 10px;backdrop-filter:blur(6px);line-height:1.15}
.chip span{display:block;font-weight:800;font-size:13px}
.chip em{display:block;font-style:normal;font-size:9px;letter-spacing:1.4px;color:var(--acc)}
.hud-right{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
.stat{background:rgba(16,19,25,.62);border:1px solid rgba(255,255,255,.10);border-radius:12px;
  padding:4px 9px;text-align:right;min-width:62px;backdrop-filter:blur(6px)}
.stat span{display:block;font-size:8px;letter-spacing:1.4px;color:var(--dim)}
.stat b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.speedo{position:fixed;left:calc(14px + var(--sal));bottom:calc(120px + var(--sab));
  display:flex;align-items:baseline;gap:4px;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.speedo b{font-size:42px;font-weight:900;font-variant-numeric:tabular-nums;line-height:.9}
.speedo span{font-size:11px;color:var(--dim);letter-spacing:1px}
body.landscape .speedo{bottom:calc(20px + var(--sab));left:calc(206px + var(--sal))}
body.landscape .speedo b{font-size:34px}
#toast{position:fixed;left:50%;top:calc(206px + var(--sat));transform:translate(-50%,-8px);
  background:rgba(16,19,25,.85);border:1px solid rgba(255,255,255,.12);border-radius:999px;
  padding:7px 16px;font-weight:800;font-size:13px;opacity:0;transition:.25s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
body.landscape #toast{top:calc(150px + var(--sat))}

/* ---------------- controles de toque ---------------- */
#touch{position:fixed;inset:0;pointer-events:none}
.pad{position:fixed;bottom:calc(14px + var(--sab));pointer-events:auto}
.pad-left{left:calc(14px + var(--sal));display:flex;gap:10px;align-items:flex-end}
.pad-right{right:calc(14px + var(--sar));display:grid;gap:10px;
  grid-template-areas:"brk ." "drf gas";justify-items:end;align-items:end}
.pad-right .brake{grid-area:brk}
.pad-right .drift{grid-area:drf}
.pad-right .gas{grid-area:gas}
.pad-hint{position:fixed;right:calc(18px + var(--sar));bottom:calc(196px + var(--sab));
  font-size:10px;color:rgba(255,255,255,.45);letter-spacing:.3px;pointer-events:none;
  text-shadow:0 1px 6px rgba(0,0,0,.8);animation:fadeAway 1s ease 6s forwards}
.pad-hint b{color:var(--acc2)}
@keyframes fadeAway{to{opacity:0}}
body.landscape .pad-hint{bottom:calc(120px + var(--sab))}
.tbtn{width:78px;height:78px;border-radius:50%;font-weight:900;font-size:15px;
  background:rgba(28,33,42,.60);border:1.5px solid rgba(255,255,255,.16);
  backdrop-filter:blur(8px);transition:transform .07s,background .07s;display:grid;place-items:center}
.tbtn.down{transform:scale(.93);background:rgba(255,209,102,.28);border-color:var(--acc)}
.tbtn.steer{font-size:26px}
.tbtn.gas{width:92px;height:92px;background:rgba(74,222,128,.20);border-color:rgba(74,222,128,.45)}
.tbtn.drift{background:rgba(229,69,58,.20);border-color:rgba(229,69,58,.45);font-size:13px}
.tbtn.brake{width:64px;height:64px;font-size:12px}
@media (max-height:420px){ .tbtn{width:64px;height:64px} .tbtn.gas{width:76px;height:76px}
  .tbtn.brake{width:54px;height:54px;font-size:10px} }
@media (max-width:380px){ .tbtn{width:68px;height:68px} .tbtn.gas{width:82px;height:82px}
  .tbtn.brake{width:56px;height:56px;font-size:10px} }

/* ---------------- telas ---------------- */
.screen{position:fixed;inset:0;display:grid;place-items:center;padding:calc(16px + var(--sat)) 16px calc(16px + var(--sab));
  background:radial-gradient(120% 90% at 50% 0%,#1b2130 0%,#0b0e13 70%);overflow-y:auto;z-index:5}
.panel{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;
  padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.55);margin:auto}
.panel.wide{width:min(760px,100%)}
.panel.small{width:min(360px,100%)}
.logo{display:flex;align-items:baseline;gap:8px;justify-content:center;margin-bottom:2px}
.logo span{font-weight:900;font-size:34px;letter-spacing:-1px}
.logo b{font-weight:900;font-size:34px;color:var(--acc);letter-spacing:-1px}
.tagline{text-align:center;color:var(--dim);font-size:13px;margin:0 0 18px}
h2{margin:0 0 16px;font-size:20px;text-align:center}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.pick-btn{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left}
.pick-btn span{display:block;font-size:9px;letter-spacing:1.6px;color:var(--dim)}
.pick-btn b{display:block;font-size:16px;margin:2px 0}
.pick-btn em{display:block;font-style:normal;font-size:11px;color:var(--acc)}
.pick-btn:active{transform:scale(.98)}
.modes{display:grid;gap:9px}
.big{width:100%;padding:15px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);
  font-size:16px;font-weight:800}
.big.primary{background:linear-gradient(180deg,#ffd977,#f0b429);color:#241a02;border-color:#f0b429}
.big:active{transform:scale(.985)}
.ghost{display:block;width:100%;margin-top:10px;padding:12px;border-radius:14px;color:var(--dim);
  background:transparent;border:1px solid var(--line);font-weight:700;font-size:14px}
.ghost.danger{color:#f87171;border-color:#43272a}
.hint{margin:16px 0 0;text-align:center;color:#66707f;font-size:11px;line-height:1.7}
.hint kbd{background:#242a34;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:10px}
@media (max-width:520px){ .hint{display:none} }

/* ---------------- cartões ---------------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:14px}
.card{display:flex;gap:10px;align-items:center;text-align:left;padding:9px;border-radius:16px;
  background:var(--panel2);border:1.5px solid var(--line)}
.card.active{border-color:var(--acc);background:#262b33}
.card:active{transform:scale(.99)}
.thumb{width:76px;height:56px;border-radius:10px;flex:0 0 auto;background:#000}
.card-info{min-width:0;flex:1}
.card-info h3{margin:0;font-size:14px}
.card-info p{margin:2px 0 0;font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-info .meta{color:var(--acc);font-size:10px}
.card-info .dim{color:var(--dim)}
.bar{display:flex;align-items:center;gap:6px;margin-top:3px}
.bar span{font-size:9px;color:var(--dim);width:46px}
.bar i{flex:1;height:4px;background:#333a45;border-radius:3px;overflow:hidden}
.bar u{display:block;height:100%;background:var(--acc);text-decoration:none}

/* ---------------- opções ---------------- */
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}
.opt span{font-size:14px;font-weight:700}
.opt em{display:block;font-style:normal;font-size:11px;color:var(--dim);font-weight:400;margin-top:1px}
.opt input[type=checkbox]{width:46px;height:27px;appearance:none;background:#333a45;border-radius:99px;position:relative;transition:.2s;flex:0 0 auto}
.opt input[type=checkbox]:checked{background:var(--acc)}
.opt input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;
  border-radius:50%;background:#fff;transition:.2s}
.opt input[type=checkbox]:checked::after{left:22px}
.opt.range input[type=range]{width:110px;accent-color:var(--acc)}
.opt.range b{min-width:52px;text-align:right;font-size:13px;color:var(--acc)}

/* ---------------- resultados ---------------- */
.rows{margin:4px 0 16px}
.rows .row{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.rows .row span{color:var(--dim)}
.rows .row b{font-variant-numeric:tabular-nums}

</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- ============ HUD ============ -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="hud-left">
      <button id="btn-pause" class="icon-btn" aria-label="Pausar">II</button>
      <div class="chip"><span id="hud-track">—</span><em id="hud-mode">—</em></div>
    </div>
    <div class="hud-right">
      <div class="stat" id="hud-pos-wrap"><span>POS</span><b id="hud-pos">1/6</b></div>
      <div class="stat" id="hud-lap-wrap"><span>VOLTA</span><b id="hud-lap">1/3</b></div>
      <div class="stat"><span>TEMPO</span><b id="hud-time">--:--.---</b></div>
      <div class="stat" id="hud-best-wrap"><span>MELHOR</span><b id="hud-best">--:--.---</b></div>
      <div class="stat" id="hud-drift-wrap"><span>DRIFT</span><b id="hud-drift">0</b></div>
    </div>
  </div>
  <div class="speedo"><b id="hud-speed">0</b><span>km/h</span></div>
  <div id="toast"></div>
</div>

<!-- ============ CONTROLES ============ -->
<div id="touch" class="hidden">
  <div class="pad pad-left">
    <button class="tbtn steer" data-btn="left" aria-label="Esquerda">◀</button>
    <button class="tbtn steer" data-btn="right" aria-label="Direita">▶</button>
  </div>
  <div class="pad pad-right">
    <button class="tbtn brake" data-btn="brake" aria-label="Freio">FREIO</button>
    <button class="tbtn drift" data-btn="drift" aria-label="Freio de mão">DRIFT</button>
    <button class="tbtn gas" id="btn-gas" data-btn="gas" aria-label="Acelerar">GÁS</button>
  </div>
  <div class="pad-hint">segure <b>DRIFT</b> na entrada da curva</div>
</div>

<!-- ============ MENU ============ -->
<section id="screen-menu" class="screen hidden">
  <div class="panel">
    <div class="logo"><span>DRIFT</span><b>GP</b></div>
    <p class="tagline">Corridas de cima, traseira solta, circuitos de F1.</p>

    <div class="pick">
      <button id="btn-open-tracks" class="pick-btn">
        <span>CIRCUITO</span><b id="menu-track">—</b><em id="menu-record">—</em>
      </button>
      <button id="btn-open-cars" class="pick-btn">
        <span>CARRO</span><b id="menu-car">—</b><em>trocar</em>
      </button>

/* ===== utils.js ===== */
/* ============================================================
   utils.js - matemática, splines e helpers gerais
   ============================================================ */
'use strict';

const TAU = Math.PI * 2;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }

/* normaliza ângulo para [-PI, PI] */
function wrapAngle(a) {
  while (a > Math.PI) a -= TAU;
  while (a < -Math.PI) a += TAU;
  return a;
}

/* gerador pseudo-aleatório determinístico (mesma pista = mesmo capim) */
function makeRng(seed) {
  let s = seed >>> 0 || 1;
  return function () {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}

/* spline Catmull-Rom fechada: transforma poucos pontos de controle
   em uma curva suave (é assim que os circuitos são desenhados) */
function catmullRomClosed(pts, samplesPerSeg) {
  const out = [];
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    for (let j = 0; j < samplesPerSeg; j++) {
      const t = j / samplesPerSeg, t2 = t * t, t3 = t2 * t;
      const x = 0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t +
        (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 +
        (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3);
      const y = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t +
        (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 +
        (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
      out.push([x, y]);
    }
  }
  return out;
}

/* reamostra uma polilinha fechada em pontos igualmente espaçados */
function resampleClosed(poly, spacing) {
  const out = [];
  let carryX = poly[0][0], carryY = poly[0][1];
  out.push([carryX, carryY]);
  let leftover = 0;
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    let segLen = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (segLen < 1e-6) continue;
    const ux = (b[0] - a[0]) / segLen, uy = (b[1] - a[1]) / segLen;
    let d = spacing - leftover;
    while (d <= segLen) {
      out.push([a[0] + ux * d, a[1] + uy * d]);
      d += spacing;
    }
    leftover = segLen - (d - spacing);
  }
  /* evita ponto duplicado no fechamento */
  const last = out[out.length - 1], first = out[0];
  if (Math.hypot(last[0] - first[0], last[1] - first[1]) < spacing * 0.5) out.pop();
  return out;
}

/* escurece (t<0) ou clareia (t>0) uma cor #rrggbb */
function shade(hex, t) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const f = v => clamp(Math.round(t < 0 ? v * (1 + t) : v + (255 - v) * t), 0, 255);
  return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
}

/* Suaviza apenas os "bicos" do traçado: onde o raio da curva fica
   menor que minRadius, o ponto é puxado para o meio dos vizinhos.
   Sem isso, uma chicane desenhada à mão vira uma curva impossível. */
function relaxCurvature(pts, spacing, minRadius, iters) {
  let cur = pts.map(p => p.slice());
  const n = cur.length;
  for (let it = 0; it < iters; it++) {
    const out = cur.map(p => p.slice());
    let changed = false;
    for (let i = 0; i < n; i++) {
      const a = cur[(i - 1 + n) % n], b = cur[i], c = cur[(i + 1) % n];
      const a1 = Math.atan2(b[1] - a[1], b[0] - a[0]);
      const a2 = Math.atan2(c[1] - b[1], c[0] - b[0]);
      const dth = Math.abs(wrapAngle(a2 - a1));
      const r = spacing / Math.max(dth, 1e-6);
      if (r < minRadius) {
        const w = clamp(1 - r / minRadius, 0, 1) * 0.45;
        out[i][0] = b[0] + ((a[0] + c[0]) / 2 - b[0]) * w;
        out[i][1] = b[1] + ((a[1] + c[1]) / 2 - b[1]) * w;
        changed = true;
      }
    }
    cur = out;
    if (!changed) break;
  }
  return cur;
}

function fmtTime(ms) {
  if (ms == null || !isFinite(ms) || ms <= 0) return "--:--.---";
  const m = Math.floor(ms / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  const cs = Math.floor(ms % 1000);
  return (m > 0 ? m + ":" : "") + String(s).padStart(m > 0 ? 2 : 1, "0") + "." + String(cs).padStart(3, "0");
}

function ordinal(n) { return n + "º"; }

const TRACK_SPACING = 5;   /* distância entre pontos da linha central */

/* Constrói toda a geometria derivada de uma pista */
function buildTrack(def) {
  const smooth = catmullRomClosed(def.points, 24);
  let cl = resampleClosed(smooth, TRACK_SPACING);
  /* tira os bicos do desenho à mão e reamostra de novo */
  const minR = def.minRadius || Math.max(40, def.width * 0.8);
  cl = relaxCurvature(cl, TRACK_SPACING, minR, 140);
  cl = resampleClosed(cl, TRACK_SPACING);
  const n = cl.length;

  const pts = new Array(n);
  for (let i = 0; i < n; i++) {
    const p = cl[i], nx = cl[(i + 1) % n], pv = cl[(i - 1 + n) % n];
    let tx = nx[0] - pv[0], ty = nx[1] - pv[1];
    const tl = Math.hypot(tx, ty) || 1;
    tx /= tl; ty /= tl;
    pts[i] = { x: p[0], y: p[1], tx: tx, ty: ty, nx: -ty, ny: tx, curv: 0, ang: Math.atan2(ty, tx) };
  }
  /* curvatura = variação de ângulo por unidade de comprimento */
  for (let i = 0; i < n; i++) {
    const a = pts[(i - 2 + n) % n].ang, b = pts[(i + 2) % n].ang;
    pts[i].curv = wrapAngle(b - a) / (4 * TRACK_SPACING);
  }
  /* suaviza a curvatura para os kerbs não ficarem picotados */
  const cs = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    let s = 0;
    for (let k = -3; k <= 3; k++) s += pts[(i + k + n) % n].curv;
    cs[i] = s / 7;
  }
  for (let i = 0; i < n; i++) pts[i].curv = cs[i];

  /* limites do desenho */
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  for (const p of pts) {
    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
  }
  const pad = def.width / 2 + def.runoff + 60;

  /* grade espacial para achar o ponto mais próximo sem varrer tudo */
  const cell = 48;
  const gx0 = Math.floor((minX - pad) / cell), gy0 = Math.floor((minY - pad) / cell);
  const gw = Math.ceil((maxX + pad) / cell) - gx0 + 1;
  const gh = Math.ceil((maxY + pad) / cell) - gy0 + 1;
  const grid = new Array(gw * gh);
  for (let i = 0; i < n; i++) {
    const cx = Math.floor(pts[i].x / cell) - gx0, cy = Math.floor(pts[i].y / cell) - gy0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const k = (cy + dy) * gw + (cx + dx);
      if (k < 0 || k >= grid.length) continue;
      (grid[k] || (grid[k] = [])).push(i);
    }
  }

  const track = {
    def: def, pts: pts, n: n, spacing: TRACK_SPACING,
    width: def.width, half: def.width / 2, runoff: def.runoff,
    length: n * TRACK_SPACING,
    bounds: { x: minX - pad, y: minY - pad, w: (maxX - minX) + pad * 2, h: (maxY - minY) + pad * 2 },

    /* índice do ponto mais próximo, buscando primeiro numa janela
       ao redor do último índice conhecido (rápido e evita saltos) */
    nearestIndex: function (x, y, lastIdx) {
      if (lastIdx != null) {
        let best = -1, bestD = Infinity;
        for (let k = -40; k <= 140; k++) {
          const i = (lastIdx + k + n) % n;
          const d = dist2(x, y, pts[i].x, pts[i].y);
          if (d < bestD) { bestD = d; best = i; }
        }
        if (bestD < 90000) return best;
      }
      const cx = Math.floor(x / cell) - gx0, cy = Math.floor(y / cell) - gy0;
      const bucket = (cy >= 0 && cy < gh && cx >= 0 && cx < gw) ? grid[cy * gw + cx] : null;
      let best = 0, bestD = Infinity;
      const list = bucket && bucket.length ? bucket : null;
      if (list) {
        for (let j = 0; j < list.length; j++) {
          const d = dist2(x, y, pts[list[j]].x, pts[list[j]].y);
          if (d < bestD) { bestD = d; best = list[j]; }
        }
      } else {
        for (let i = 0; i < n; i += 2) {
          const d = dist2(x, y, pts[i].x, pts[i].y);
          if (d < bestD) { bestD = d; best = i; }
        }
      }
      return best;
    },

    /* onde estou em relação à pista */
    surfaceAt: function (x, y, lastIdx) {
      const i = track.nearestIndex(x, y, lastIdx);
      const p = pts[i];
      const dx = x - p.x, dy = y - p.y;
      const side = dx * p.nx + dy * p.ny;          /* distância lateral com sinal */
      const dist = Math.abs(side);
      return {
        idx: i, dist: dist, side: side,
        onTrack: dist <= track.half,
        kerb: dist > track.half - 7 && dist <= track.half + 4,
        nx: p.nx, ny: p.ny
      };
    },

    /* posição a X unidades de comprimento de arco da linha de chegada */
    atArc: function (s) {
      let i = Math.round(s / TRACK_SPACING) % n;
      if (i < 0) i += n;
      return pts[i];
    }
  };
  return track;
}

/* ===== car.js ===== */
/* ============================================================
   car.js - física arcade de drift
   Modelo: a velocidade é decomposta em componente frontal e
   lateral. A lateral é "comida" pelo grip; com o freio de mão

'use strict';

const CAR_TYPES = [
  {
    id: 'sprinter', name: 'Sprinter', tag: 'Equilibrado',
    color: '#e5453a', accent: '#ffd166',

function carTypeById(id) { return CAR_TYPES.find(c => c.id === id) || CAR_TYPES[0]; }

const CAR_LEN = 30, CAR_WID = 16;

class Car {
  constructor(spec, track, isPlayer) {
    this.spec = spec;
    this.track = track;
    this.isPlayer = !!isPlayer;
    this.x = 0; this.y = 0; this.angle = 0;
    this.vx = 0; this.vy = 0;
    this.steerAngle = 0;
    this.idx = 0; this.prevIdx = 0;
    this.lap = 0; this.finished = false; this.finishTime = 0;
    this.lapStart = 0; this.bestLap = null; this.lastLap = null; this.lapTimes = [];
    this.slip = 0; this.speed = 0; this.offTrack = false;
    this.driftScore = 0; this.driftCombo = 1; this.driftTimer = 0; this.driftBank = 0;
    this.hitTimer = 0; this.name = spec.name; this.halfPassed = true;
    this.wheelTrail = [null, null];
    this.assist = 0.55;
  }

  placeAtArc(s, lateral) {
    const p = this.track.atArc(s);
    this.x = p.x + p.nx * lateral;
    this.y = p.y + p.ny * lateral;
    this.angle = p.ang;
    this.vx = 0; this.vy = 0;
    this.idx = this.prevIdx = this.track.nearestIndex(this.x, this.y, null);
  }

  update(dt, inp, now) {
    const track = this.track;
    const sp = this.spec;
    const ca = Math.cos(this.angle), sa = Math.sin(this.angle);

    let fwd = this.vx * ca + this.vy * sa;
    let lat = -this.vx * sa + this.vy * ca;

    const surf = track.surfaceAt(this.x, this.y, this.idx);
    this.idx = surf.idx;
    this.offTrack = !surf.onTrack;
    this.onKerb = surf.kerb;

    const off = this.offTrack;
    const power = off ? 0.48 : 1;
    const drag = off ? 2.9 : 1.06 + (fwd > 0 ? fwd / sp.top * 0.5 : 0);

    /* motor e freio */
    if (inp.throttle > 0) fwd += sp.engine * power * inp.throttle * dt;
    if (inp.brake > 0) {
      if (fwd > 2) fwd -= sp.brake * inp.brake * dt;
      else fwd = Math.max(fwd - 260 * inp.brake * dt, -130);
    }
    fwd -= fwd * drag * dt;
    if (inp.handbrake && fwd > 0) fwd -= fwd * 0.9 * dt;

    /* aderência lateral: quanto mais perto de 1, mais escorrega */
    let g = inp.handbrake ? sp.driftGrip : sp.grip;
    if (off) g = Math.min(0.972, g + 0.075);
    if (this.onKerb) g = Math.min(0.975, g + 0.03);
    /* acelerar forte durante a derrapagem mantém o carro atravessado */
    if (inp.throttle > 0.6 && Math.abs(lat) > 30) g = Math.min(0.985, g + 0.02);
    lat *= Math.pow(g, dt * 60);

    /* recompõe a velocidade AINDA com o ângulo antigo (é daqui que nasce o drift) */
    this.vx = fwd * ca - lat * sa;
    this.vy = fwd * sa + lat * ca;

    /* direção */
    const speed = Math.hypot(this.vx, this.vy);
    this.speed = speed;
    const resp = Math.min(1, speed / 62);
    const hiDamp = 1 - 0.40 * Math.min(1, speed / sp.top);
    const dir = fwd >= -1 ? 1 : -1;
    this.steerAngle += (inp.steer - this.steerAngle) * Math.min(1, dt * 10);
    this.angle += this.steerAngle * sp.turn * resp * hiDamp * dir * dt;

    /* ângulo de derrapagem */
    this.slip = (speed > 6) ? wrapAngle(Math.atan2(this.vy, this.vx) - this.angle) : 0;
    if (fwd < -1) this.slip = 0;

    /* ajuda de contra-esterço: estabiliza sem tirar a diversão */
    if (this.assist > 0 && !inp.handbrake && Math.abs(this.slip) > 0.35 && fwd > 20) {
      const corr = -this.slip * (Math.abs(this.slip) - 0.35) * 2.2 * this.assist;
      this.angle -= corr * dt;
    }

    /* integração */
    this.x += this.vx * dt;
    this.y += this.vy * dt;

    /* muros e limites do circuito */
    const limit = track.half + track.runoff;
    if (surf.dist > limit) {
      const s2 = track.surfaceAt(this.x, this.y, this.idx);
      if (s2.dist > limit) {
        const over = s2.dist - limit;
        const sgn = Math.sign(s2.side) || 1;
        this.x -= s2.nx * sgn * over;
        this.y -= s2.ny * sgn * over;
        const vn = this.vx * s2.nx * sgn + this.vy * s2.ny * sgn;
        if (vn > 0) { this.vx -= s2.nx * sgn * vn * 1.4; this.vy -= s2.ny * sgn * vn * 1.4; }
        this.vx *= 0.80; this.vy *= 0.80;
        this.hitTimer = 0.25;
      }
    }
    if (this.hitTimer > 0) this.hitTimer -= dt;

    /* pontuação de drift */
    const driftOk = !off && Math.abs(this.slip) > 0.22 && speed > 85;
    if (driftOk) {
      this.driftTimer += dt;
      this.driftCombo = Math.min(6, 1 + this.driftTimer * 0.55);
      this.driftBank += speed * Math.abs(this.slip) * dt * 0.42;
    } else {
      if (this.driftTimer > 0.35 && !off) this.driftScore += Math.round(this.driftBank * this.driftCombo);
      else if (off) this.driftScore += Math.round(this.driftBank * 0.2);
      this.driftBank = 0; this.driftTimer = 0; this.driftCombo = 1;
    }

    /* voltas */
    this.checkLap(now);
  }

  checkLap(now) {
    const n = this.track.n;
    const a = this.prevIdx, b = this.idx;
    /* só vale a volta depois de passar pelo meio do traçado -
       evita "voltas fantasma" com o carro parado em cima da linha */
    if (b > n * 0.40 && b < n * 0.64) this.halfPassed = true;
    if (a > n * 0.72 && b < n * 0.28) {
      if (this.halfPassed) {
        if (this.lapStart > 0) {
          const t = now - this.lapStart;
          if (t > 3000) {
            this.lastLap = t;
            this.lapTimes.push(t);
            if (this.bestLap == null || t < this.bestLap) this.bestLap = t;
          }
        }
        this.lap++;
        this.lapStart = now;
        this.halfPassed = false;
      }
    } else if (a < n * 0.28 && b > n * 0.72) {
      this.halfPassed = false;
    }
    this.prevIdx = b;
  }

  progress() { return this.lap * this.track.n + this.idx; }

  /* posições dos 4 pneus no mundo (para marcas e fumaça) */
  wheelPos(front, right) {
    const ca = Math.cos(this.angle), sa = Math.sin(this.angle);
    const lx = front ? CAR_LEN * 0.32 : -CAR_LEN * 0.32;
    const ly = right ? CAR_WID * 0.44 : -CAR_WID * 0.44;
    return [this.x + lx * ca - ly * sa, this.y + lx * sa + ly * ca];
  }
}

/* colisão simples entre carros: empurra e troca um pouco de energia */
function resolveCarCollisions(cars, trackN) {
  for (let i = 0; i < cars.length; i++) {
    for (let j = i + 1; j < cars.length; j++) {
      const a = cars[i], b = cars[j];
      /* carros com voltas muito diferentes não colidem (evita fantasmas) */
      const dp = Math.abs((a.idx - b.idx + trackN) % trackN);
      if (Math.min(dp, trackN - dp) > trackN * 0.08) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      const minD = 25;
      if (d > minD || d < 0.0001) continue;
      const ux = dx / d, uy = dy / d;
      const push = (minD - d) * 0.5;
      a.x -= ux * push; a.y -= uy * push;
      b.x += ux * push; b.y += uy * push;
      const rel = (b.vx - a.vx) * ux + (b.vy - a.vy) * uy;
      if (rel < 0) {
        const imp = rel * 0.55;
        a.vx += ux * imp; a.vy += uy * imp;
        b.vx -= ux * imp; b.vy -= uy * imp;
        a.hitTimer = b.hitTimer = 0.18;
      }
    }
  }
}

/* ===== ai.js ===== */
/* ============================================================
   ai.js - pilotos controlados pelo computador
   Miram um ponto adiante na trajetória ideal e calculam a
   velocidade máxima possível pela curvatura da curva que vem.
   ============================================================ */
'use strict';

const AI_NAMES = ['R. Prata', 'D. Kowalski', 'M. Tanaka', 'L. Duarte', 'F. Rossi',
  'A. Okafor', 'V. Petrov', 'C. Mendes', 'J. Halvorsen', 'B. Nakano'];

class AIDriver {
  constructor(car, skill, lane) {
    this.car = car;
    this.skill = skill;          /* 0.86 (lento) .. 1.06 (rápido) */
    this.lane = lane;            /* deslocamento lateral preferido */
    this.noise = Math.random() * 1000;
    this.hbTimer = 0;
    this.stuck = 0;
    this.reverse = 0;
  }

  think(dt, t) {
    const car = this.car, track = car.track, n = track.n;
    const speed = car.speed;
    const off = car.offTrack;

    /* ---- recuperação: preso no muro ou atolado ---- */
    if (speed < 34) this.stuck += dt; else this.stuck = Math.max(0, this.stuck - dt * 2.5);
    if (this.stuck > 1.1 && this.reverse <= 0) { this.reverse = 1.0; this.stuck = 0; }
    if (this.reverse > 0) {
      this.reverse -= dt;
      const rp = track.pts[(car.idx + 8) % n];
      const rd = wrapAngle(Math.atan2(rp.y - car.y, rp.x - car.x) - car.angle);
      return { steer: clamp(-rd * 2, -1, 1), throttle: 0, brake: 1, handbrake: false };
    }

    /* ponto de mira à frente, proporcional à velocidade */
    const aheadUnits = (off ? 26 : 40) + speed * 0.36;
    const ai = (car.idx + Math.round(aheadUnits / track.spacing)) % n;
    const ap = track.pts[ai];

    /* trajetória: por dentro da curva, aberto na reta.
       fora da pista, mira direto na linha central para voltar */
    const k = ap.curv;
    const apexPull = clamp(Math.abs(k) * 900, 0, 1);
    const wob = Math.sin((t * 0.0007) + this.noise) * 0.07;
    const offset = off ? 0
      : (-Math.sign(k) * apexPull * 0.30 + this.lane * (1 - apexPull * 0.6) + wob) * track.half;
    const tx = ap.x + ap.nx * offset;
    const ty = ap.y + ap.ny * offset;

    /* esterço: mira no ponto à frente + correção do desvio lateral atual
       (só a mira faz o carro cortar a curva por dentro e sair da pista) */
    const cp = track.pts[car.idx];
    const latNow = (car.x - cp.x) * cp.nx + (car.y - cp.y) * cp.ny;
    const latErr = latNow - offset;
    const want = Math.atan2(ty - car.y, tx - car.x);
    const diff = wrapAngle(want - car.angle);
    const steer = clamp(diff * 2.2 - latErr * 0.007, -1, 1);

    /* velocidade alvo: pior curvatura nos próximos ~150 pontos */
    let worst = 0;
    const span = Math.round((60 + speed * 0.62) / track.spacing);
    for (let s = 2; s < span; s += 3) {
      const c = Math.abs(track.pts[(car.idx + s) % n].curv);
      const weight = 1 - (s / span) * 0.35;
      if (c * weight > worst) worst = c * weight;
    }
    /* nesta física quem limita a curva é a velocidade de giro do carro:
       raio = v / w, com w máximo = turn * (1 - 0.4 * v/top).
       Resolvendo para v dá a velocidade máxima de passagem na curva. */
    const yawLimit = car.spec.turn / (worst + 0.4 * car.spec.turn / car.spec.top);
    let target = 0.90 * this.skill * yawLimit;
    target = Math.min(target, car.spec.top * this.skill);
    if (off) target = Math.min(target, 190);
    /* muito atravessado em relação ao alvo: reduz até se alinhar */
    if (Math.abs(diff) > 0.8) target = Math.min(target, 130);

    let throttle = 0, brake = 0;
    if (speed > target * 1.05) brake = clamp((speed - target) / 95, 0.2, 0.9);
    else throttle = clamp((target - speed) / 40 + 0.4, 0, 1);
    if (off) throttle = Math.min(throttle, 0.65);

    /* freio de mão em curvas bem fechadas: deixa a IA atravessada também */
    this.hbTimer -= dt;
    if (!off && this.hbTimer <= -0.9 && Math.abs(diff) > 0.62 && speed > 200 && Math.abs(k) > 0.0075) {
      this.hbTimer = 0.45;
    }
    const handbrake = this.hbTimer > 0.2;

    return { steer: steer, throttle: throttle, brake: brake, handbrake: handbrake };
  }
}

function makeGrid(track, playerSpec, opponentCount, playerSlot, difficulty) {
  const cars = [], ais = [];
  const usedNames = AI_NAMES.slice().sort(() => Math.random() - 0.5);
  const total = opponentCount + 1;
  const specs = CAR_TYPES;
  for (let i = 0; i < total; i++) {
    const isPlayer = i === playerSlot;
    const spec = isPlayer ? playerSpec : Object.assign({}, specs[(i * 3 + 1) % specs.length], {
      color: AI_COLORS[i % AI_COLORS.length]
    });
    const car = new Car(spec, track, isPlayer);
    const arc = -(46 + i * 40);
    const lateral = (i % 2 === 0 ? -1 : 1) * track.half * 0.34;
    car.placeAtArc((track.length + arc) % track.length, lateral);
    car.name = isPlayer ? 'VOCÊ' : usedNames[i % usedNames.length];
    cars.push(car);
    if (!isPlayer) {
      const base = 0.90 + difficulty * 0.055;
      const skill = base + (Math.random() - 0.5) * 0.05;
      ais.push(new AIDriver(car, skill, (Math.random() - 0.5) * 0.44));
    }
  }
  return { cars: cars, ais: ais };
}

const AI_COLORS = ['#ff8c1a', '#8b5cf6', '#00c2d1', '#ec4899', '#facc15', '#94a3b8', '#22c55e'];

/* ===== audio.js ===== */
/* ============================================================
   audio.js - som sintetizado (nenhum arquivo, funciona offline)
   ============================================================ */
'use strict';

const Sound = {
  ctx: null, ready: false, muted: false,
  engine: null, skid: null, master: null,

  init: function () {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = this.ctx = new AC();

    this.master = ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.9;
    this.master.connect(ctx.destination);

    /* --- motor: duas ondas dente-de-serra + filtro --- */
    const eg = ctx.createGain(); eg.gain.value = 0;
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = 900; filt.Q.value = 3;
    const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 60;
    const o2 = ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = 30;
    const g2 = ctx.createGain(); g2.gain.value = 0.35;
    o1.connect(filt); o2.connect(g2); g2.connect(filt);
    filt.connect(eg); eg.connect(this.master);
    o1.start(); o2.start();
    this.engine = { o1: o1, o2: o2, gain: eg, filter: filt };

    /* --- derrapagem: ruído branco filtrado --- */
    const len = ctx.sampleRate * 2;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 0.9;
    const sg = ctx.createGain(); sg.gain.value = 0;
    src.connect(bp); bp.connect(sg); sg.connect(this.master);
    src.start();
    this.skid = { gain: sg, filter: bp };

    this.ready = true;
  },

  setMuted: function (m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.9;
  },

  /* chamado a cada quadro com o estado do carro do jogador */
  updateEngine: function (rpm, load, slip, playing) {
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    const freq = 48 + rpm * 300;
    this.engine.o1.frequency.setTargetAtTime(freq, t, 0.05);
    this.engine.o2.frequency.setTargetAtTime(freq * 0.5, t, 0.05);
    this.engine.filter.frequency.setTargetAtTime(500 + rpm * 2600 + load * 700, t, 0.06);
    this.engine.gain.gain.setTargetAtTime(playing ? (0.045 + load * 0.055) : 0, t, 0.08);
    this.skid.gain.gain.setTargetAtTime(playing ? clamp(slip * 0.16, 0, 0.11) : 0, t, 0.05);
    this.skid.filter.frequency.setTargetAtTime(1600 + slip * 1800, t, 0.1);
  },

  blip: function (freq, dur, type, vol) {
    if (!this.ready || this.muted) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.15));
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + (dur || 0.15) + 0.05);
  },

  crash: function () {
    if (!this.ready || this.muted) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const len = Math.floor(ctx.sampleRate * 0.25);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = ctx.createBufferSource(); s.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    const g = ctx.createGain(); g.gain.value = 0.35;
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t);
  }
};

/* ===== render.js ===== */
/* ============================================================
   render.js - desenho do circuito, dos carros e dos efeitos
   O traçado é desenhado UMA vez numa camada em cache; a cada
   quadro só desenhamos carros, fumaça e HUD por cima.
   ============================================================ */
'use strict';

const STATIC_SCALE = 2;   /* nitidez da camada do circuito */
const MARKS_SCALE = 1.5;  /* marcas de pneu (menor = menos memória) */

function offsetPoints(track, offset) {
  const out = new Array(track.n);
  for (let i = 0; i < track.n; i++) {
    const p = track.pts[i];
    out[i] = [p.x + p.nx * offset, p.y + p.ny * offset];
  }
  return out;
}

function pathFrom(ctx, pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}

function centerPath(ctx, track) {
  ctx.beginPath();
  ctx.moveTo(track.pts[0].x, track.pts[0].y);
  for (let i = 1; i < track.n; i++) ctx.lineTo(track.pts[i].x, track.pts[i].y);
  ctx.closePath();
}

/* intensidade de curva em cada ponto (0 = reta, 1 = curva fechada).
   lo/hi definem a partir de que raio a curva "conta" */
function curveIntensity(track, lo, hi) {
  const n = track.n, raw = new Float32Array(n);
  for (let i = 0; i < n; i++) raw[i] = clamp((Math.abs(track.pts[i].curv) - lo) / (hi - lo), 0, 1);
  const sm = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    let s = 0;
    for (let k = -6; k <= 6; k++) s += raw[(i + k + n) % n];
    sm[i] = s / 13;
  }
  return sm;
}

function buildTrackLayer(track) {
  const b = track.bounds;
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(b.w * STATIC_SCALE);
  cv.height = Math.ceil(b.h * STATIC_SCALE);
  const ctx = cv.getContext('2d');
  ctx.setTransform(STATIC_SCALE, 0, 0, STATIC_SCALE, -b.x * STATIC_SCALE, -b.y * STATIC_SCALE);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  const def = track.def;
  const inten = curveIntensity(track, 0.0055, 0.013);   /* zebras */
  const sandI = curveIntensity(track, 0.0095, 0.021);   /* áreas de escape */
  const half = track.half;

  /* ---------- fundo ----------
     tudo fora do limite fica escuro: o jogador enxerga onde acaba
     a área de corrida sem precisar de muro desenhado */
  const outside = shade(def.grass, -0.55);
  ctx.fillStyle = outside;
  ctx.fillRect(b.x, b.y, b.w, b.h);

  if (!def.urban) {
    centerPath(ctx, track);
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = track.width + track.runoff * 2 + 9;
    ctx.stroke();
    centerPath(ctx, track);
    ctx.strokeStyle = def.grass;
    ctx.lineWidth = track.width + track.runoff * 2;
    ctx.stroke();
  }

  const rng = makeRng(def.id.length * 7919 + 13);
  ctx.save();
  for (let i = 0; i < 3200; i++) {
    const x = b.x + rng() * b.w, y = b.y + rng() * b.h, r = 2.5 + rng() * 9;
    ctx.fillStyle = rng() > 0.5 ? 'rgba(255,255,255,0.030)' : 'rgba(0,0,0,0.045)';
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  ctx.restore();

  if (def.urban) {
    /* quarteirões / prédios em volta do circuito de rua */
    ctx.save();
    for (let i = 0; i < 90; i++) {
      const p = track.pts[Math.floor(rng() * track.n)];
      const side = rng() > 0.5 ? 1 : -1;
      const d = half + 26 + rng() * 90;
      const w = 34 + rng() * 70, h = 30 + rng() * 60;
      const x = p.x + p.nx * side * d, y = p.y + p.ny * side * d;
      ctx.fillStyle = ['#2b313d', '#333a47', '#3c4453', '#262b35'][Math.floor(rng() * 4)];
      ctx.fillRect(x - w / 2, y - h / 2, w, h);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(x - w / 2, y + h / 2 - 6, w, 6);
    }
    ctx.restore();
  }

  /* ---------- área de escape (brita) do lado de fora das curvas ---------- */
  if (!def.urban) {
    const sandW = Math.min(track.runoff * 0.60, 44);
    for (const sideSign of [1, -1]) {
      const inner = [], outer = [];
      for (let i = 0; i < track.n; i++) {
        const p = track.pts[i];
        const isOuter = (sideSign > 0) ? (p.curv < 0) : (p.curv > 0);
        const s = isOuter ? sandI[i] * sandW : 0;
        inner.push([p.x + p.nx * sideSign * (half + 1), p.y + p.ny * sideSign * (half + 1)]);
        outer.push([p.x + p.nx * sideSign * (half + 1 + s), p.y + p.ny * sideSign * (half + 1 + s)]);
      }
      ctx.beginPath();
      ctx.moveTo(inner[0][0], inner[0][1]);
      for (let i = 1; i < inner.length; i++) ctx.lineTo(inner[i][0], inner[i][1]);
      for (let i = outer.length - 1; i >= 0; i--) ctx.lineTo(outer[i][0], outer[i][1]);
      ctx.closePath();
      ctx.fillStyle = '#b9a06a';
      ctx.fill();
    }
  }

  /* ---------- asfalto ---------- */
  centerPath(ctx, track);
  ctx.strokeStyle = 'rgba(0,0,0,0.30)';
  ctx.lineWidth = track.width + 10;
  ctx.stroke();

  centerPath(ctx, track);
  ctx.strokeStyle = def.asphalt;
  ctx.lineWidth = track.width;
  ctx.stroke();

  /* variação do asfalto + traçado ideal escurecido */
  ctx.save();
  ctx.globalAlpha = 0.10;
  centerPath(ctx, track);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = track.width * 0.42;
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  for (let i = 0; i < 700; i++) {
    const p = track.pts[Math.floor(rng() * track.n)];
    const o = (rng() - 0.5) * track.width;
    ctx.fillStyle = rng() > 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.06)';
    ctx.beginPath();
    ctx.arc(p.x + p.nx * o, p.y + p.ny * o, 4 + rng() * 16, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  /* ---------- zebras (kerbs) e linhas de borda ---------- */
  const step = 3;
  for (let i = 0; i < track.n; i += step) {
    const p = track.pts[i], q = track.pts[(i + step) % track.n];
    const k = inten[i];
    for (const sideSign of [1, -1]) {
      const o1 = half - 2.5, o2 = half + 9;
      const ax = p.x + p.nx * sideSign * o1, ay = p.y + p.ny * sideSign * o1;
      const bx = p.x + p.nx * sideSign * o2, by = p.y + p.ny * sideSign * o2;
      const cx = q.x + q.nx * sideSign * o2, cy = q.y + q.ny * sideSign * o2;
      const dx = q.x + q.nx * sideSign * o1, dy = q.y + q.ny * sideSign * o1;
      if (k > 0.22) {
        const band = Math.floor(i * track.spacing / 18) % 2;
        ctx.fillStyle = band ? '#e8ecef' : '#d8352b';
        ctx.globalAlpha = clamp((k - 0.22) * 5, 0, 1);
      } else if (!def.urban) {
        ctx.fillStyle = '#e8ecef';
        ctx.globalAlpha = 0.55;
      } else { continue; }
      ctx.beginPath();
      ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx, cy); ctx.lineTo(dx, dy);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  /* ---------- muros do circuito de rua ---------- */
  if (def.urban) {
    for (const sideSign of [1, -1]) {
      const pts = [];
      for (let i = 0; i < track.n; i++) {
        const p = track.pts[i];
        const o = sideSign * (half + track.runoff);
        pts.push([p.x + p.nx * o, p.y + p.ny * o]);
      }
      pathFrom(ctx, pts);
      ctx.strokeStyle = '#c9ced6'; ctx.lineWidth = 7; ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2; ctx.stroke();
      /* faixas vermelhas nas curvas */
      for (let i = 0; i < track.n; i += 6) {
        if (inten[i] < 0.3 || Math.floor(i / 6) % 2) continue;
        const p = track.pts[i], q = track.pts[(i + 6) % track.n];
        const o = sideSign * (half + track.runoff);
        ctx.beginPath();
        ctx.moveTo(p.x + p.nx * o, p.y + p.ny * o);
        ctx.lineTo(q.x + q.nx * o, q.y + q.ny * o);
        ctx.strokeStyle = '#d8352b'; ctx.lineWidth = 7; ctx.stroke();
      }
    }
  }

  /* ---------- linha de largada/chegada ---------- */
  drawStartLine(ctx, track);

  return { canvas: cv, bounds: b, bg: outside };
}

function drawStartLine(ctx, track) {
  const p = track.pts[0];
  const cols = 10, rows = 2, cell = track.width / cols;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.ang);
  ctx.fillStyle = '#f4f6f8';
  ctx.fillRect(-cell * rows / 2 - 1, -track.half, cell * rows + 2, track.width);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if ((r + c) % 2) continue;
      ctx.fillStyle = '#15181d';
      ctx.fillRect(-cell * rows / 2 + r * cell, -track.half + c * cell, cell, cell);
    }
  }
  ctx.restore();
}

/* ---------- marcas de pneu ---------- */
function makeMarksLayer(track) {
  const b = track.bounds;
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(b.w * MARKS_SCALE);
  cv.height = Math.ceil(b.h * MARKS_SCALE);
  const ctx = cv.getContext('2d');
  ctx.setTransform(MARKS_SCALE, 0, 0, MARKS_SCALE, -b.x * MARKS_SCALE, -b.y * MARKS_SCALE);
  ctx.lineCap = 'round';
  return { canvas: cv, ctx: ctx, bounds: b };
}

function paintTireMarks(marks, car) {
  const intensity = clamp(Math.abs(car.slip) * 1.3 - 0.14, 0, 1);
  if (intensity <= 0.02 || car.speed < 45 || car.offTrack) {
    car.wheelTrail[0] = car.wheelTrail[1] = null; return;
  }
  const ctx = marks.ctx;
  ctx.strokeStyle = 'rgba(20,20,24,' + (0.16 * intensity + 0.04).toFixed(3) + ')';
  ctx.lineWidth = 3.6;
  for (let w = 0; w < 2; w++) {
    const pos = car.wheelPos(false, w === 1);
    const prev = car.wheelTrail[w];
    if (prev) {
      const d = Math.hypot(pos[0] - prev[0], pos[1] - prev[1]);
      if (d < 40) {
        ctx.beginPath();
        ctx.moveTo(prev[0], prev[1]);
        ctx.lineTo(pos[0], pos[1]);
        ctx.stroke();
      }
    }
    car.wheelTrail[w] = pos;
  }
}

/* ---------- partículas de fumaça / poeira ---------- */
class Particles {
  constructor() { this.list = []; }
  spawn(x, y, vx, vy, r, life, color) {
    if (this.list.length > 420) return;
    this.list.push({ x: x, y: y, vx: vx, vy: vy, r: r, life: life, max: life, color: color });
  }
  update(dt) {
    const l = this.list;
    for (let i = l.length - 1; i >= 0; i--) {
      const p = l[i];
      p.life -= dt;
      if (p.life <= 0) { l.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.94; p.vy *= 0.94;
      p.r += dt * 13;
    }
  }
  draw(ctx) {
    for (const p of this.list) {
      const a = (p.life / p.max);
      ctx.globalAlpha = a * 0.38;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function emitCarParticles(parts, car, dt) {
  const slip = Math.abs(car.slip);
  if (car.speed < 40) return;
  if (slip > 0.20 && !car.offTrack) {
    if (Math.random() < clamp(slip * 2.2, 0, 1)) {
      const w = car.wheelPos(false, Math.random() > 0.5);
      parts.spawn(w[0], w[1], (Math.random() - 0.5) * 40 - car.vx * 0.06,
        (Math.random() - 0.5) * 40 - car.vy * 0.06,
        2.4 + Math.random() * 3, 0.5 + Math.random() * 0.35, '#e9e9ec');
    }
  }
  if (car.offTrack && car.speed > 60) {
    if (Math.random() < 0.75) {
      const w = car.wheelPos(false, Math.random() > 0.5);
      parts.spawn(w[0], w[1], (Math.random() - 0.5) * 60, (Math.random() - 0.5) * 60,
        2 + Math.random() * 3.5, 0.45, '#9a9068');
    }
  }
}

/* ---------- carro ---------- */
function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawCar(ctx, car) {
  const L = CAR_LEN, W = CAR_WID;
  ctx.save();
  ctx.translate(car.x, car.y);

  /* sombra */
  ctx.save();
  ctx.rotate(car.angle);
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  roundRectPath(ctx, -L / 2 + 2, -W / 2 + 3, L, W, 5);
  ctx.fill();
  ctx.restore();

  ctx.rotate(car.angle);

  /* rodas */
  const steer = car.steerAngle * 0.5;
  ctx.fillStyle = '#16181d';
  const wheels = [[L * 0.30, W * 0.50, steer], [L * 0.30, -W * 0.50, steer],
  [-L * 0.30, W * 0.52, 0], [-L * 0.30, -W * 0.52, 0]];
  for (const w of wheels) {
    ctx.save();
    ctx.translate(w[0], w[1]);
    ctx.rotate(w[2]);
    ctx.fillRect(-4.5, -2.6, 9, 5.2);
    ctx.restore();
  }

  /* carroceria */
  const g = ctx.createLinearGradient(0, -W / 2, 0, W / 2);
  g.addColorStop(0, car.spec.color);
  g.addColorStop(0.5, car.spec.color);
  g.addColorStop(1, 'rgba(0,0,0,0.28)');
  ctx.fillStyle = g;
  roundRectPath(ctx, -L / 2, -W / 2, L, W, 5);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* cabine e vidros */
  ctx.fillStyle = 'rgba(15,18,24,0.85)';
  roundRectPath(ctx, -L * 0.16, -W * 0.34, L * 0.34, W * 0.68, 3);
  ctx.fill();
  ctx.fillStyle = 'rgba(120,190,230,0.35)';
  roundRectPath(ctx, L * 0.06, -W * 0.30, L * 0.10, W * 0.60, 2);
  ctx.fill();

  /* detalhes: capô, asa traseira, faróis */
  ctx.fillStyle = car.spec.accent;
  ctx.fillRect(-L / 2 - 1.5, -W * 0.46, 3, W * 0.92);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillRect(L / 2 - 2.5, -W * 0.38, 2, 3.2);
  ctx.fillRect(L / 2 - 2.5, W * 0.38 - 3.2, 2, 3.2);
  if (car.brakeGlow > 0) {
    ctx.fillStyle = 'rgba(255,60,40,' + car.brakeGlow.toFixed(2) + ')';
    ctx.fillRect(-L / 2, -W * 0.40, 2.5, W * 0.80);
  }

  if (car.hitTimer > 0) {
    ctx.globalAlpha = clamp(car.hitTimer * 3, 0, 0.6);
    ctx.fillStyle = '#fff';
    roundRectPath(ctx, -L / 2, -W / 2, L, W, 5);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawPlayerArrow(ctx, car, t) {
  ctx.save();
  ctx.translate(car.x, car.y - 24);
  const bob = Math.sin(t * 0.006) * 2;
  ctx.translate(0, bob);
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath();
  ctx.moveTo(0, 6); ctx.lineTo(-6, -4); ctx.lineTo(6, -4);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------- minimapa ---------- */
function drawMinimap(ctx, track, cars, x, y, size) {
  const b = track.bounds;
  const s = size / Math.max(b.w, b.h);
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(10,12,16,0.62)';
  roundRectPath(ctx, -7, -7, size + 14, size + 14, 10);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.translate((size - b.w * s) / 2, (size - b.h * s) / 2);
  ctx.scale(s, s);
  ctx.translate(-b.x, -b.y);
  ctx.lineJoin = ctx.lineCap = 'round';
  centerPath(ctx, track);
  ctx.strokeStyle = 'rgba(255,255,255,0.60)';
  ctx.lineWidth = track.width * 0.95;
  ctx.stroke();
  /* marca a linha de chegada */
  const sp = track.pts[0];
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = track.width * 0.9;
  ctx.beginPath();
  ctx.moveTo(sp.x + sp.nx * track.half, sp.y + sp.ny * track.half);
  ctx.lineTo(sp.x - sp.nx * track.half, sp.y - sp.ny * track.half);
  ctx.stroke();
  for (const c of cars) {
    ctx.fillStyle = c.isPlayer ? '#fff' : c.spec.color;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.isPlayer ? 26 : 18, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

/* ===== game.js ===== */
/* ============================================================
   game.js - laço principal, telas, controles e regras
   ============================================================ */
'use strict';

const Game = {
  state: 'menu',           /* menu | countdown | racing | paused | over */
  mode: 'race',            /* race | time | drift */
  trackDef: TRACK_DEFS[0],
  carSpec: CAR_TYPES[0],
  track: null, layer: null, marks: null, parts: null,
  cars: [], ais: [], player: null,
  cam: { x: 0, y: 0, zoom: 1 },
  clock: 0, countdown: 0, raceTime: 0, driftTimeLeft: 0,
  totalLaps: 3, finishOrder: [],
  settings: { autoGas: false, assist: true, sound: true, opponents: 5, difficulty: 1 },
  records: {},
  toast: { text: '', life: 0 },
  driftPop: { text: '', life: 0 }
};

/* ---------------- armazenamento ---------------- */
function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem('gc_settings') || '{}');
    Object.assign(Game.settings, s);
    Game.records = JSON.parse(localStorage.getItem('gc_records') || '{}');
  } catch (e) { }
}
function saveSettings() {
  try { localStorage.setItem('gc_settings', JSON.stringify(Game.settings)); } catch (e) { }
}
function saveRecords() {
  try { localStorage.setItem('gc_records', JSON.stringify(Game.records)); } catch (e) { }
}
function rec(trackId) {
  return Game.records[trackId] || (Game.records[trackId] = { best: null, drift: 0 });
}

/* ---------------- canvas ---------------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let cw = 0, ch = 0, dpr = 1;
let safeTop = 0, safeLeft = 0, safeBottom = 0;

/* lê as margens seguras (notch do iPhone) uma vez por redimensionamento */
function readSafeArea() {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;' +
    'padding:env(safe-area-inset-top) env(safe-area-inset-right) ' +
    'env(safe-area-inset-bottom) env(safe-area-inset-left)';
  document.body.appendChild(d);
  const cs = getComputedStyle(d);
  safeTop = parseFloat(cs.paddingTop) || 0;
  safeLeft = parseFloat(cs.paddingLeft) || 0;
  safeBottom = parseFloat(cs.paddingBottom) || 0;
  d.remove();
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const r = canvas.getBoundingClientRect();
  cw = r.width; ch = r.height;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  readSafeArea();
  document.body.classList.toggle('landscape', cw > ch);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

/* ---------------- controles ---------------- */
const keys = {};
const touch = { left: false, right: false, gas: false, brake: false, drift: false };

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Escape' || e.code === 'KeyP') togglePause();
  if (e.code === 'KeyR' && (Game.state === 'racing' || Game.state === 'over')) startRace();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function bindTouch() {
  document.querySelectorAll('[data-btn]').forEach(el => {
    const k = el.dataset.btn;
    const on = e => { e.preventDefault(); touch[k] = true; el.classList.add('down'); Sound.init(); };
    const off = e => { e.preventDefault(); touch[k] = false; el.classList.remove('down'); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
    el.addEventListener('contextmenu', e => e.preventDefault());
  });
}

function playerInput() {
  const s = Game.settings;
  let steer = 0;
  if (keys.ArrowLeft || keys.KeyA || touch.left) steer -= 1;
  if (keys.ArrowRight || keys.KeyD || touch.right) steer += 1;
  let gas = (keys.ArrowUp || keys.KeyW || touch.gas) ? 1 : 0;
  let brake = (keys.ArrowDown || keys.KeyS || touch.brake) ? 1 : 0;
  const hand = (keys.Space || keys.ShiftLeft || touch.drift) ? true : false;
  if (s.autoGas && !brake) gas = 1;
  if (Game.state !== 'racing') { gas = Game.state === 'countdown' ? gas * 0 : 0; brake = 0; }
  return { steer: steer, throttle: gas, brake: brake, handbrake: hand };
}

/* ---------------- montagem da corrida ---------------- */
function prepareTrack(def) {
  Game.trackDef = def;
  Game.track = buildTrack(def);
  Game.layer = buildTrackLayer(Game.track);
  Game.marks = makeMarksLayer(Game.track);
  Game.parts = new Particles();
}

function startRace() {
  const def = Game.trackDef;
  if (!Game.track || Game.track.def.id !== def.id) prepareTrack(def);
  else { Game.marks = makeMarksLayer(Game.track); Game.parts = new Particles(); }

  const opponents = Game.mode === 'race' ? Game.settings.opponents : 0;
  const slot = opponents;                       /* jogador larga por último */
  const g = makeGrid(Game.track, Game.carSpec, opponents, slot, Game.settings.difficulty);
  Game.cars = g.cars; Game.ais = g.ais;
  Game.player = g.cars[slot];
  Game.player.assist = Game.settings.assist ? 0.6 : 0.12;
  for (const c of Game.cars) { if (!c.isPlayer) c.assist = 0.5; }

  Game.totalLaps = Game.mode === 'race' ? def.laps : (Game.mode === 'time' ? 99 : 99);
  Game.finishOrder = [];
  Game.raceTime = 0;
  Game.driftTimeLeft = 90;
  Game.countdown = Game.mode === 'race' ? 3.6 : 2.2;
  Game.state = 'countdown';
  Game.clock = performance.now();
  Game.cam.x = Game.player.x; Game.cam.y = Game.player.y;
  Game.cam.zoom = baseZoom();
  Game.toast.life = 0; Game.driftPop.life = 0;

  showScreen(null);
  document.body.classList.add('playing');
  document.getElementById('hud').classList.remove('hidden');
  updateHudStatic();
  Sound.init();
}

function baseZoom() { return clamp(Math.min(cw, ch) / 340, 0.65, 2.4); }

/* ---------------- laço principal ---------------- */
let last = performance.now(), acc = 0;
const STEP = 1 / 120;

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;

  if (Game.state === 'countdown' || Game.state === 'racing' || Game.state === 'over') {
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard++ < 12) { simulate(STEP, now); acc -= STEP; }
    render(now, dt);
  } else if (Game.state === 'paused') {
    render(now, 0);
  }
  hudTick(dt);
}

function simulate(dt, now) {
  const G = Game;

  if (G.state === 'countdown') {
    G.countdown -= dt;
    const prev = Math.ceil(G.countdown + dt);
    const cur = Math.ceil(G.countdown);
    if (cur !== prev && cur >= 0 && cur <= 3) Sound.blip(cur === 0 ? 880 : 440, 0.18, 'square', 0.22);
    if (G.countdown <= 0) {
      G.state = 'racing';
      G.raceTime = 0;
      for (const c of G.cars) { c.lapStart = 0; c.lap = 0; c.prevIdx = c.idx; c.halfPassed = true; }
    }
  } else if (G.state === 'racing') {
    G.raceTime += dt * 1000;
    if (G.mode === 'drift') {
      G.driftTimeLeft -= dt;
      if (G.driftTimeLeft <= 0) { G.driftTimeLeft = 0; endRace(); }
    }
  }

  const inp = playerInput();

  for (let i = 0; i < G.ais.length; i++) {
    const ai = G.ais[i];
    const c = ai.car;
    if (G.state === 'countdown') { c.update(dt, { steer: 0, throttle: 0, brake: 0, handbrake: true }, G.raceTime); continue; }
    const a = ai.think(dt, G.raceTime);
    c.brakeGlow = a.brake > 0.1 ? 0.9 : 0;
    c.update(dt, a, G.raceTime);
  }

  const p = G.player;
  p.brakeGlow = inp.brake > 0.1 ? 0.9 : 0;
  const wasLap = p.lap;
  p.update(dt, inp, G.raceTime);
  if (p.lap !== wasLap && p.lastLap) onLapDone(p);

  resolveCarCollisions(G.cars, G.track.n);

  /* efeitos */
  for (const c of G.cars) {
    paintTireMarks(G.marks, c);
    emitCarParticles(G.parts, c, dt);
  }
  G.parts.update(dt);

  /* fim de corrida */
  if (G.state === 'racing' && G.mode === 'race') {
    for (const c of G.cars) {
      if (!c.finished && c.lap > G.totalLaps) {
        c.finished = true;
        c.finishTime = G.raceTime;
        G.finishOrder.push(c);
        if (c.isPlayer) endRace();
      }
    }
  }
}

function onLapDone(p) {
  const r = rec(Game.trackDef.id);
  if (p.lastLap && (r.best == null || p.lastLap < r.best)) {
    r.best = p.lastLap; saveRecords();
    showToast('NOVO RECORDE! ' + fmtTime(p.lastLap), 2.6);
    Sound.blip(1320, 0.25, 'triangle', 0.2);
  } else if (p.lastLap) {
    showToast('Volta ' + fmtTime(p.lastLap), 1.8);
  }
}

function endRace() {
  Game.state = 'over';
  const p = Game.player;
  p.driftScore += Math.round(p.driftBank * p.driftCombo);
  const r = rec(Game.trackDef.id);
  let newDrift = false;
  if (p.driftScore > (r.drift || 0)) { r.drift = p.driftScore; newDrift = true; }
  saveRecords();
  setTimeout(() => showResults(newDrift), 700);
}

/* ---------------- desenho ---------------- */
function render(now, dt) {
  const G = Game, p = G.player;
  if (!p) return;

  /* câmera */
  const lead = 0.30;
  const tx = p.x + p.vx * lead, ty = p.y + p.vy * lead;
  const k = Math.min(1, (dt || 0.016) * 5.5);
  G.cam.x = lerp(G.cam.x, tx, k);
  G.cam.y = lerp(G.cam.y, ty, k);
  const zTarget = baseZoom() * (1 - 0.16 * clamp(p.speed / p.spec.top, 0, 1));
  G.cam.zoom = lerp(G.cam.zoom, zTarget, Math.min(1, (dt || 0.016) * 2.5));

  let shake = 0;
  if (p.hitTimer > 0) shake = p.hitTimer * 14;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = G.layer.bg || '#12151a';
  ctx.fillRect(0, 0, cw, ch);

  ctx.save();
  ctx.translate(cw / 2, ch / 2);
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  ctx.scale(G.cam.zoom, G.cam.zoom);
  ctx.translate(-G.cam.x, -G.cam.y);

  const b = G.layer.bounds;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(G.layer.canvas, b.x, b.y, b.w, b.h);
  ctx.drawImage(G.marks.canvas, b.x, b.y, b.w, b.h);
  G.parts.draw(ctx);

  for (const c of G.cars) if (!c.isPlayer) drawCar(ctx, c);
  drawCar(ctx, p);
  if (G.state === 'countdown') drawPlayerArrow(ctx, p, now);

  ctx.restore();

  /* minimapa */
  const ms = clamp(Math.min(cw, ch) * 0.19, 70, 130);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawMinimap(ctx, G.track, G.cars, 20 + safeLeft, 62 + safeTop, ms);

  /* contagem regressiva */
  if (G.state === 'countdown') {
    const n = Math.ceil(G.countdown);
    const txt = n > 0 ? String(Math.min(n, 3)) : 'VAI!';
    const scale = 1 + (1 - (G.countdown % 1)) * 0.25;
    ctx.save();
    ctx.translate(cw / 2, ch * 0.34);
    ctx.scale(scale, scale);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 76px Inter, system-ui, sans-serif';
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.strokeText(txt, 0, 0);
    ctx.fillStyle = n > 0 ? '#ffd166' : '#4ade80';
    ctx.fillText(txt, 0, 0);
    ctx.restore();
  }

  /* aviso de drift */
  if (Game.driftPop.life > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(Game.driftPop.life, 0, 1);
    ctx.textAlign = 'center';
    ctx.font = '900 30px Inter, system-ui, sans-serif';
    ctx.fillStyle = '#ffd166';
    ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 5;
    ctx.strokeText(Game.driftPop.text, cw / 2, ch * 0.22);
    ctx.fillText(Game.driftPop.text, cw / 2, ch * 0.22);
    ctx.restore();
  }
}

/* ---------------- HUD ---------------- */
const el = id => document.getElementById(id);
let hudAcc = 0;

function updateHudStatic() {
  el('hud-track').textContent = Game.trackDef.name;
  el('hud-mode').textContent = Game.mode === 'race' ? 'CORRIDA' : (Game.mode === 'time' ? 'CONTRA-RELÓGIO' : 'DRIFT');
  el('hud-pos-wrap').classList.toggle('hidden', Game.mode !== 'race');
  el('hud-lap-wrap').classList.toggle('hidden', Game.mode === 'drift');
  el('hud-best-wrap').classList.toggle('hidden', Game.mode === 'drift');
  el('hud-drift-wrap').classList.toggle('hidden', false);
  el('btn-gas').classList.toggle('hidden', !!Game.settings.autoGas);
}

function hudTick(dt) {
  const G = Game;
  if (!G.player || (G.state !== 'racing' && G.state !== 'countdown' && G.state !== 'over')) return;
  if (G.toast.life > 0) G.toast.life -= dt;
  if (G.driftPop.life > 0) G.driftPop.life -= dt;

  const p = G.player;
  if (p.driftTimer > 0.4) {
    G.driftPop.text = 'DRIFT x' + p.driftCombo.toFixed(1) + '  +' + Math.round(p.driftBank * p.driftCombo);
    G.driftPop.life = 0.5;
  }

  hudAcc += dt;
  if (hudAcc < 0.08) return;
  hudAcc = 0;

  const r = rec(G.trackDef.id);
  el('hud-speed').textContent = Math.round(p.speed * 0.62);
  el('hud-lap').textContent = Math.min(p.lap + 1, G.totalLaps) + (G.mode === 'race' ? '/' + G.totalLaps : '');
  el('hud-time').textContent = G.mode === 'drift'
    ? Math.max(0, G.driftTimeLeft).toFixed(1) + 's'
    : fmtTime(p.lapStart ? (G.raceTime - p.lapStart) : G.raceTime);
  el('hud-best').textContent = fmtTime(p.bestLap || r.best);
  el('hud-drift').textContent = (p.driftScore + Math.round(p.driftBank * p.driftCombo)).toLocaleString('pt-BR');

  if (G.mode === 'race') {
    const sorted = G.cars.slice().sort((a, b) => b.progress() - a.progress());
    el('hud-pos').textContent = (sorted.indexOf(p) + 1) + '/' + G.cars.length;
  }

  const t = el('toast');
  t.textContent = G.toast.text;
  t.classList.toggle('show', G.toast.life > 0);
}

function showToast(text, life) { Game.toast.text = text; Game.toast.life = life; }

/* ---------------- telas ---------------- */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('hidden', s.id !== id));
  const playing = id === null;
  document.getElementById('hud').classList.toggle('hidden', !playing);
  document.getElementById('touch').classList.toggle('hidden', !playing);
  document.body.classList.toggle('menu-open', !playing);
}

function togglePause() {
  if (Game.state === 'racing' || Game.state === 'countdown') {
    Game.state = 'paused';
    showScreen('screen-pause');
    Sound.updateEngine(0, 0, 0, false);
  } else if (Game.state === 'paused') {
    Game.state = Game.countdown > 0 ? 'countdown' : 'racing';
    showScreen(null);
    last = performance.now();
  }
}

function quitToMenu() {
  Game.state = 'menu';
  document.body.classList.remove('playing');
  Sound.updateEngine(0, 0, 0, false);
  showScreen('screen-menu');
  refreshMenu();
}

function showResults(newDrift) {
  const G = Game, p = G.player;
  const box = el('results-body');
  let pos = 1;
  if (G.mode === 'race') {
    const sorted = G.cars.slice().sort((a, b) => b.progress() - a.progress());
    pos = sorted.indexOf(p) + 1;
  }
  const r = rec(G.trackDef.id);
  const rows = [];
  if (G.mode === 'race') rows.push(['Posição final', ordinal(pos) + ' de ' + G.cars.length]);
  if (G.mode !== 'drift') {
    rows.push(['Tempo total', fmtTime(G.raceTime)]);
    rows.push(['Melhor volta', fmtTime(p.bestLap)]);
    rows.push(['Recorde da pista', fmtTime(r.best)]);
  }
  rows.push(['Pontos de drift', p.driftScore.toLocaleString('pt-BR') + (newDrift ? '  🏆' : '')]);
  rows.push(['Recorde de drift', (r.drift || 0).toLocaleString('pt-BR')]);

  el('results-title').textContent = G.mode === 'race'
    ? (pos === 1 ? 'VITÓRIA!' : ordinal(pos) + ' lugar')
    : (G.mode === 'drift' ? 'Tempo esgotado' : 'Sessão encerrada');
  el('results-sub').textContent = G.trackDef.name + ' · ' + p.spec.name;
  box.innerHTML = rows.map(x => '<div class="row"><span>' + x[0] + '</span><b>' + x[1] + '</b></div>').join('');
  showScreen('screen-results');
}

/* ---------------- menus ---------------- */
function refreshMenu() {
  el('menu-track').textContent = Game.trackDef.country + ' ' + Game.trackDef.name;
  el('menu-car').textContent = Game.carSpec.name;
  const r = rec(Game.trackDef.id);
  el('menu-record').textContent = r.best ? 'Recorde: ' + fmtTime(r.best) : 'Sem recorde ainda';
}

function buildTrackList() {
  const wrap = el('track-list');
  wrap.innerHTML = '';
  TRACK_DEFS.forEach(def => {
    const r = Game.records[def.id] || {};
    const card = document.createElement('button');
    card.className = 'card' + (def.id === Game.trackDef.id ? ' active' : '');
    card.innerHTML =
      '<canvas class="thumb" width="150" height="110"></canvas>' +
      '<div class="card-info">' +
      '<h3>' + def.country + ' ' + def.name + '</h3>' +
      '<p>' + def.sub + '</p>' +
      '<p class="meta">' + def.laps + ' voltas · ' + '★'.repeat(def.difficulty) + '<span class="dim">' +
      (r.best ? ' · ' + fmtTime(r.best) : '') + '</span></p>' +
      '</div>';
    card.onclick = () => {
      Game.trackDef = def;
      buildTrackList();
      refreshMenu();
      Sound.blip(660, 0.06, 'triangle', 0.12);
    };
    wrap.appendChild(card);
    drawThumb(card.querySelector('.thumb'), def);
  });
}

function drawThumb(cv, def) {
  const t = buildTrack(def);
  const c = cv.getContext('2d');
  const b = t.bounds;
  const s = Math.min(cv.width / b.w, cv.height / b.h) * 0.9;
  c.fillStyle = def.urban ? '#3a4150' : '#2f5c2c';
  c.fillRect(0, 0, cv.width, cv.height);
  c.save();
  c.translate((cv.width - b.w * s) / 2, (cv.height - b.h * s) / 2);
  c.scale(s, s); c.translate(-b.x, -b.y);
  c.lineJoin = c.lineCap = 'round';
  centerPath(c, t);
  c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = t.width + 14; c.stroke();
  centerPath(c, t);
  c.strokeStyle = '#7d838c'; c.lineWidth = t.width; c.stroke();
  const p = t.pts[0];
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(p.x, p.y, t.width * 0.55, 0, TAU); c.fill();
  c.restore();
}

function buildCarList() {
  const wrap = el('car-list');
  wrap.innerHTML = '';
  CAR_TYPES.forEach(spec => {
    const card = document.createElement('button');
    card.className = 'card car-card' + (spec.id === Game.carSpec.id ? ' active' : '');
    const bars = ['Potência', 'Freio', 'Drift'].map((label, i) =>
      '<div class="bar"><span>' + label + '</span><i>' +
      '<u style="width:' + (spec.stats[i] / 5 * 100) + '%"></u></i></div>').join('');
    card.innerHTML =
      '<canvas class="thumb car-thumb" width="150" height="110"></canvas>' +
      '<div class="card-info"><h3>' + spec.name + '</h3><p>' + spec.tag + '</p>' + bars + '</div>';
    card.onclick = () => { Game.carSpec = spec; buildCarList(); refreshMenu(); Sound.blip(660, 0.06, 'triangle', 0.12); };
    wrap.appendChild(card);
    const c = card.querySelector('.thumb').getContext('2d');
    c.fillStyle = '#22262e'; c.fillRect(0, 0, 150, 110);
    c.save(); c.translate(75, 55); c.scale(2.4, 2.4); c.rotate(-Math.PI / 2);
    drawCar(c, { x: 0, y: 0, angle: 0, spec: spec, steerAngle: 0.25, hitTimer: 0, brakeGlow: 0 });
    c.restore();
  });
}

function buildSettings() {
  const s = Game.settings;
  el('set-autogas').checked = s.autoGas;
  el('set-assist').checked = s.assist;
  el('set-sound').checked = s.sound;
  el('set-opponents').value = s.opponents;
  el('set-opponents-val').textContent = s.opponents;
  el('set-difficulty').value = s.difficulty;
  el('set-difficulty-val').textContent = ['Fácil', 'Normal', 'Difícil'][s.difficulty];
}

/* ---------------- ligações da interface ---------------- */
function wireUI() {
  el('btn-play-race').onclick = () => { Game.mode = 'race'; startRace(); };
  el('btn-play-time').onclick = () => { Game.mode = 'time'; startRace(); };
  el('btn-play-drift').onclick = () => { Game.mode = 'drift'; startRace(); };

  el('btn-open-tracks').onclick = () => { buildTrackList(); showScreen('screen-track'); };
  el('btn-open-cars').onclick = () => { buildCarList(); showScreen('screen-car'); };
  el('btn-open-settings').onclick = () => { buildSettings(); showScreen('screen-settings'); };
  document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => { refreshMenu(); showScreen('screen-menu'); });

  el('btn-pause').onclick = togglePause;
  el('btn-resume').onclick = togglePause;
  el('btn-restart').onclick = startRace;
  el('btn-quit').onclick = quitToMenu;
  el('btn-results-again').onclick = startRace;
  el('btn-results-menu').onclick = quitToMenu;

  el('set-autogas').onchange = e => { Game.settings.autoGas = e.target.checked; saveSettings(); updateHudStatic(); };
  el('set-assist').onchange = e => {
    Game.settings.assist = e.target.checked; saveSettings();
    if (Game.player) Game.player.assist = e.target.checked ? 0.6 : 0.12;
  };
  el('set-sound').onchange = e => { Game.settings.sound = e.target.checked; Sound.setMuted(!e.target.checked); saveSettings(); };
  el('set-opponents').oninput = e => {
    Game.settings.opponents = +e.target.value;
    el('set-opponents-val').textContent = e.target.value; saveSettings();
  };
  el('set-difficulty').oninput = e => {
    Game.settings.difficulty = +e.target.value;
    el('set-difficulty-val').textContent = ['Fácil', 'Normal', 'Difícil'][+e.target.value]; saveSettings();
  };
  el('btn-reset-records').onclick = () => {
    Game.records = {}; saveRecords(); refreshMenu(); buildTrackList();
    showToastMenu('Recordes apagados');
  };

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && Game.state === 'racing') togglePause();
  });
  ['pointerdown', 'keydown'].forEach(ev =>
    window.addEventListener(ev, () => { Sound.init(); Sound.setMuted(!Game.settings.sound); }, { once: true }));
}

function showToastMenu(msg) {
  const t = el('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

/* ---------------- som por quadro ---------------- */
setInterval(() => {
  const p = Game.player;
  const playing = (Game.state === 'racing' || Game.state === 'countdown');
  if (!p) { Sound.updateEngine(0, 0, 0, false); return; }
  const rpm = clamp(p.speed / p.spec.top, 0, 1) * 0.75 + (playerInput().throttle * 0.25);
  Sound.updateEngine(rpm, playerInput().throttle, Math.abs(p.slip) * (p.speed > 60 ? 1 : 0), playing);
}, 60);

/* ---------------- início ---------------- */
function boot() {
  loadStore();
  resize();
  bindTouch();
  wireUI();
  Sound.muted = !Game.settings.sound;
  prepareTrack(Game.trackDef);
  refreshMenu();
  showScreen('screen-menu');
  requestAnimationFrame(frame);

  const noSW = window.__STANDALONE__ || location.search.indexOf('nosw') >= 0 ||
    localStorage.getItem('gc_nosw');
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !noSW) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  }
}
if (document.readyState === 'complete') boot();
else window.addEventListener('load', boot);

</script>
